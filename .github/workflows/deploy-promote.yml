name: Promote Image Between Stages
run-name: Promote from ${{ github.event.inputs.fromHub }} → ${{ github.event.inputs.toHub }}

on:
  workflow_dispatch:
    inputs:
      fromHub:
        description: "Source environment"
        required: true
        type: choice
        options:
          - BACKEND_EMEA_TEST
          - BACKEND_US_TEST

      toHub:
        description: "Target environment"
        required: true
        type: choice
        options:
          - BACKEND_EMEA_TEST
          - BACKEND_US_TEST

      imageTag:
        description: "Tag of the image to promote"
        required: true


jobs:

  sourceProperties:
    uses: ./.github/workflows/datacenterMap.yml
    with:
      hubEnv: ${{ github.event.inputs.fromHub }}
    secrets: inherit

  targetProperties:
    uses: ./.github/workflows/datacenterMap.yml
    with:
      hubEnv: ${{ github.event.inputs.toHub }}
    secrets: inherit

  promote:
    needs: [sourceProperties, targetProperties]
    runs-on: ubuntu-latest

    env:
      SRC_REGION:      ${{ needs.sourceProperties.outputs.REGION }}
      SRC_ACCOUNT:     ${{ needs.sourceProperties.outputs.AWS_ACCOUNT }}

      DST_REGION:      ${{ needs.targetProperties.outputs.REGION }}
      DST_ACCOUNT:     ${{ needs.targetProperties.outputs.AWS_ACCOUNT }}

      SRC_REPO: backend
      DST_REPO: backend
      IMAGE_TAG: ${{ github.event.inputs.imageTag }}


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set creds for source region
        if: env.SRC_REGION == 'eu-central-1'
        run: |
          echo "AWS_KEY_SRC=${{ secrets.BACKEND_EMEA_TEST_AWS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_SRC=${{ secrets.BACKEND_EMEA_TEST_AWS_SECRET }}" >> $GITHUB_ENV

      - name: Set creds for source region
        if: env.SRC_REGION == 'us-east-1'
        run: |
          echo "AWS_KEY_SRC=${{ secrets.BACKEND_US_TEST_AWS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_SRC=${{ secrets.BACKEND_US_TEST_AWS_SECRET }}" >> $GITHUB_ENV


      - name: Set creds for target region
        if: env.DST_REGION == 'eu-central-1'
        run: |
          echo "AWS_KEY_DST=${{ secrets.BACKEND_EMEA_TEST_AWS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_DST=${{ secrets.BACKEND_EMEA_TEST_AWS_SECRET }}" >> $GITHUB_ENV

      - name: Set creds for target region
        if: env.DST_REGION == 'us-east-1'
        run: |
          echo "AWS_KEY_DST=${{ secrets.BACKEND_US_TEST_AWS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_DST=${{ secrets.BACKEND_US_TEST_AWS_SECRET }}" >> $GITHUB_ENV


      - name: Configure AWS creds (source)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_KEY_SRC }}
          aws-secret-access-key: ${{ env.AWS_SECRET_SRC }}
          aws-region: ${{ env.SRC_REGION }}

      - name: Login to ECR (source)
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull image from source
        run: |
          docker pull ${{ env.SRC_ACCOUNT }}.dkr.ecr.${{ env.SRC_REGION }}.amazonaws.com/${{ env.SRC_REPO }}:${{ env.IMAGE_TAG }}

      - name: Configure AWS creds (target)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_KEY_DST }}
          aws-secret-access-key: ${{ env.AWS_SECRET_DST }}
          aws-region: ${{ env.DST_REGION }}

      - name: Login to ECR (target)
        uses: aws-actions/amazon-ecr-login@v2

      - name: Retag and push to target
        run: |
          SRC="${{ env.SRC_ACCOUNT }}.dkr.ecr.${{ env.SRC_REGION }}.amazonaws.com/${{ env.SRC_REPO }}"
          DST="${{ env.DST_ACCOUNT }}.dkr.ecr.${{ env.DST_REGION }}.amazonaws.com/${{ env.DST_REPO }}"

          docker tag $SRC:${{ env.IMAGE_TAG }} $DST:${{ env.IMAGE_TAG }}
          docker push $DST:${{ env.IMAGE_TAG }}

      - name: Deploy on ECS target
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: assembly-fargate/src/main/resources/fargate/${{ github.event.inputs.toHub }}/task.json
          cluster: ${{ needs.targetProperties.outputs.CLUSTER_NAME }}
          service: ${{ needs.targetProperties.outputs.SERVICE_NAME }}
          wait-for-service-stability: true

  
  pipelinePassed:
    runs-on: ubuntu-latest
    needs: buildTestDeploy
    steps:
      - name: All passed
        run: |
          echo "All steps have passed."