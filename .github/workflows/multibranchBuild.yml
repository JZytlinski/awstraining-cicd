name: Multibranch pipeline
run-name: Multibranch ${{ github.head_ref || github.ref_name }}

on:
  #push:
  #  branches:
   #   - master
    #  - release/*
    #  - feature/*
     # - bugfix/*
  workflow_dispatch:
    inputs:
      skipSmokeTests:
        description: Should skip smoke tests?
        type: boolean
        required: false
        default: false
      hubEnv:
        description: Select target hub and stage
        required: true
        type: choice
        options:
          - 'BACKEND_EMEA_TEST'
          - 'BACKEND_US_TEST'

jobs:
  properties:
    #    TODO call datacenterMap reusable workflow to get AWS_ACCOUNT, PROFILE, REGION and other variables based on hubEnv input
    uses: ./.github/workflows/datacenterMap.yml
    with:
      hubEnv: ${{ github.event.inputs.hubEnv }}
    secrets: inherit


  buildTestDeploy:
    #    TODO Checkout, JDK 17 setup, Maven setup, 
    #     Build with JaCoCo, Configure AWS credentials, 
    # Login to Amazon ECR, Push image to Amazon ECR, 
    #Deploy Amazon ECS task definition, 
    #Run smoke tests if not skipped
    
    needs: [properties]
    runs-on: ubuntu-latest
    env:
          AWS_ACCOUNT: ${{ needs.properties.outputs.AWS_ACCOUNT }}
          #AWS_KEY:  ${{ secrets.BACKEND_EMEA_TEST_AWS_KEY }}
          #AWS_SECRET: ${{ secrets.BACKEND_EMEA_TEST_AWS_SECRET }}
          AWS_REGION: ${{ needs.properties.outputs.REGION }}
          CLUSTER_NAME: ${{ needs.properties.outputs.CLUSTER_NAME }}
          SERVICE_NAME: ${{ needs.properties.outputs.SERVICE_NAME }}
          SKIP_SMOKE_TESTS: ${{ (github.event.inputs.skipSmokeTests != null && github.event.inputs.skipSmokeTests == 'true') || 'false' }}
          #SMOKETEST_BACKEND_PASSWORD: ${{ secrets.BACKEND_EMEA_TEST_SMOKETEST_BACKEND_PASSWORD }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set AWS creds for eu-central-1
        if: env.AWS_REGION == 'eu-central-1'
        run: |
          echo "AWS_KEY=${{ secrets.BACKEND_EMEA_TEST_AWS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET=${{ secrets.BACKEND_EMEA_TEST_AWS_SECRET }}" >> $GITHUB_ENV

      - name: Set AWS creds for us-east-1
        if: env.AWS_REGION == 'us-east-1'
        run: |
          echo "AWS_KEY=${{ secrets.BACKEND_US_TEST_AWS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET=${{ secrets.BACKEND_US_TEST_AWS_SECRET }}" >> $GITHUB_ENV

      - name: Set smoke test password for eu-central-1
        if: env.AWS_REGION == 'eu-central-1'
        run: |
          echo "SMOKETEST_BACKEND_PASSWORD=${{ secrets.BACKEND_EMEA_TEST_SMOKETEST_BACKEND_PASSWORD }}" >> $GITHUB_ENV

      - name: Set smoke test password for us-east-1
        if: env.AWS_REGION == 'us-east-1'
        run: |
          echo "SMOKETEST_BACKEND_PASSWORD=${{ secrets.BACKEND_US_TEST_SMOKETEST_BACKEND_PASSWORD }}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      
      - name: Maven setup
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.8.2

      - name: Run Unit Tests
        run: |
           mvn clean test

      - name: Build
        run: mvn clean org.jacoco:jacoco-maven-plugin:prepare-agent package org.jacoco:jacoco-maven-plugin:report


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_KEY }}
          aws-secret-access-key: ${{ env.AWS_SECRET }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: backend
        run: |
          docker build -t backend .
          docker tag backend:latest $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_REF##*/}
          docker tag backend:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_REF##*/}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: assembly-fargate/src/main/resources/fargate/${{ github.event.inputs.hubEnv }}/task.json
          service: ${{ env.SERVICE_NAME }}
          cluster: ${{ env.CLUSTER_NAME }}
          wait-for-service-stability: true


      
      - name: Run smoke tests
        if: ${{ env.SKIP_SMOKE_TESTS == 'false' }}
        run: |
          mvn -f pom.xml clean test -P st,${{ github.event.inputs.hubEnv }}





  pipelinePassed:
    runs-on: ubuntu-latest
    needs: buildTestDeploy
    steps:
      - name: All passed
        run: |
          echo "All steps have passed."