name: Provision with Terraform
run-name: Provision with Terraform

on:
  workflow_dispatch:
    inputs:
      hubEnv:
        description: Select target hub and stage
        required: true
        type: choice
        options:
          - 'BACKEND_EMEA_TEST'


jobs:
  properties:
    #    TODO call datacenterMap reusable workflow to get AWS_ACCOUNT, PROFILE, REGION and other variables based on hubEnv input
    
    uses: ./.github/workflows/datacenterMap.yml
    with:
      hubEnv: ${{ github.event.inputs.hubEnv }}

  terraform:
    #    TODO Checkout, Install Terraform, Configure AWS profile, Run Terraform apply with setup_new_region.sh script 
    #     and w2.sh script to provision infrastructure in the new region
    needs: [properties]
    runs-on: ubuntu-latest

    env:
      HUB:           ${{ needs.properties.outputs.HUB }}
      STAGE:         ${{ needs.properties.outputs.STAGE }}
      AWS_ACCOUNT:   ${{ needs.properties.outputs.AWS_ACCOUNT }}
      AWS_REGION:    ${{ needs.properties.outputs.REGION }}
      PROFILE:       ${{ needs.properties.outputs.PROFILE }}
      CLUSTER_NAME:  ${{ needs.properties.outputs.CLUSTER_NAME }}
      SERVICE_NAME:  ${{ needs.properties.outputs.SERVICE_NAME }}
      TASK_NAME:     ${{ needs.properties.outputs.TASK_NAME }}
      HUB_ENV:       ${{ github.event.inputs.hubEnv }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BACKEND_EMEA_TEST_AWS_KEY }}
          aws-secret-access-key: ${{ secrets.BACKEND_EMEA_TEST_AWS_SECRET }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run setup_new_region.sh
        shell: bash
        run: 
          chmod +x setup_new_region.sh w2.sh
          ./setup_new_region.sh w2.sh "$PROFILE" "$AWS_REGION" apply -auto-approve



  